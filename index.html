<!doctype html>
<html lang="he" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Live signal journal for the SMT and QT bots — updates from GitHub every 60 seconds.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📓%3C/text%3E%3C/svg%3E">
<title>Trading Journal</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}</style>
<style>
  :root {
    --ink: #0F1418;
    --panel: #161B21;
    --panel-lift: #1D242C;
    --rule: #252C34;
    --rule-strong: #303842;
    --fg: #EAEEF3;
    --fg-dim: #99A3AF;
    --fg-mute: #5A6371;
    --accent: #E8B04A;
    --accent-dim: rgba(232, 176, 74, 0.15);
    --long: #5AB889;
    --long-dim: rgba(90, 184, 137, 0.13);
    --short: #C56E68;
    --short-dim: rgba(197, 110, 104, 0.13);
    --info: #7B9DC7;
    --info-dim: rgba(123, 157, 199, 0.13);
    --amber: #D9A55C;
    --amber-dim: rgba(217, 165, 92, 0.13);
    --sky: #6FA8DC;
    --live: #5AB889;

    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Cascadia Mono", monospace;

    --sp-1: 4px;
    --sp-2: 8px;
    --sp-3: 12px;
    --sp-4: 16px;
    --sp-5: 24px;
    --sp-6: 32px;
    --sp-8: 48px;
    --sp-10: 64px;

    --radius: 6px;
    --radius-lg: 10px;

    color-scheme: dark light;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ink: #F8F5EF;
      --panel: #FFFFFF;
      --panel-lift: #F5EFE1;
      --rule: #E4DDCC;
      --rule-strong: #D0C7B2;
      --fg: #1A1F26;
      --fg-dim: #565E6A;
      --fg-mute: #8B93A0;
      --accent: #A87826;
      --accent-dim: rgba(168, 120, 38, 0.14);
      --long: #3B8560;
      --long-dim: rgba(59, 133, 96, 0.13);
      --short: #A64F4A;
      --short-dim: rgba(166, 79, 74, 0.13);
      --info: #4E6F97;
      --info-dim: rgba(78, 111, 151, 0.13);
      --amber: #A87826;
      --amber-dim: rgba(168, 120, 38, 0.14);
      --sky: #4E6F97;
      --live: #3B8560;
    }
  }

  :root[data-theme="light"] {
    --ink: #F8F5EF;
    --panel: #FFFFFF;
    --panel-lift: #F5EFE1;
    --rule: #E4DDCC;
    --rule-strong: #D0C7B2;
    --fg: #1A1F26;
    --fg-dim: #565E6A;
    --fg-mute: #8B93A0;
    --accent: #A87826;
    --accent-dim: rgba(168, 120, 38, 0.14);
    --long: #3B8560;
    --long-dim: rgba(59, 133, 96, 0.13);
    --short: #A64F4A;
    --short-dim: rgba(166, 79, 74, 0.13);
    --info: #4E6F97;
    --info-dim: rgba(78, 111, 151, 0.13);
    --amber: #A87826;
    --amber-dim: rgba(168, 120, 38, 0.14);
    --sky: #4E6F97;
    --live: #3B8560;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--fg);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .app {
    max-width: 1400px;
    margin: 0 auto;
    padding: var(--sp-5) var(--sp-5) var(--sp-8);
  }

  /* ── HEADER ─────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--sp-5);
    padding-bottom: var(--sp-5);
    border-bottom: 1px solid var(--rule);
    margin-bottom: var(--sp-5);
    flex-wrap: wrap;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }

  h1::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    transform: rotate(45deg);
    box-shadow: 12px 0 0 var(--long), 24px 0 0 var(--short);
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: var(--sp-4);
    color: var(--fg-dim);
    font-size: 12px;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-2);
    padding: 4px 10px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--fg-dim);
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--live);
    box-shadow: 0 0 0 3px color-mix(in oklab, var(--live) 25%, transparent);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; }
  }

  .theme-toggle {
    background: none;
    border: 1px solid var(--rule);
    color: var(--fg-dim);
    padding: 6px 10px;
    font-size: 11px;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-radius: 100px;
    cursor: pointer;
    transition: color 120ms, border-color 120ms;
  }
  .theme-toggle:hover { color: var(--fg); border-color: var(--rule-strong); }

  /* ── KPI STRIP ──────────────────────────────────────────────────── */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: var(--sp-3);
    margin-bottom: var(--sp-5);
  }

  .kpi {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    padding: var(--sp-4);
    position: relative;
  }

  .kpi-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-mute);
    margin-bottom: var(--sp-2);
  }

  .kpi-value {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    color: var(--fg);
    line-height: 1;
  }

  .kpi-hint {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-dim);
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  .kpi.accent { border-color: color-mix(in oklab, var(--accent) 40%, var(--rule)); }
  .kpi.accent .kpi-value { color: var(--accent); }

  /* ── FILTERS ───────────────────────────────────────────────────── */
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-4);
    padding: var(--sp-3) 0;
    margin-bottom: var(--sp-4);
    border-bottom: 1px solid var(--rule);
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }

  .filter-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-mute);
    margin-right: var(--sp-2);
  }

  .seg {
    display: inline-flex;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 2px;
    gap: 2px;
  }

  .seg button {
    background: none;
    border: none;
    color: var(--fg-dim);
    padding: 5px 12px;
    font-size: 12px;
    font-family: inherit;
    font-weight: 500;
    border-radius: 4px;
    cursor: pointer;
    transition: background 120ms, color 120ms;
  }

  .seg button:hover { color: var(--fg); }
  .seg button.active { background: var(--panel-lift); color: var(--fg); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .search-input {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    color: var(--fg);
    padding: 6px 10px;
    font-size: 12px;
    font-family: inherit;
    width: 200px;
  }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  .refresh-btn {
    background: var(--panel);
    border: 1px solid var(--rule);
    color: var(--fg-dim);
    padding: 6px 12px;
    font-size: 11px;
    font-family: inherit;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-radius: var(--radius);
    cursor: pointer;
    transition: color 120ms, border-color 120ms;
    margin-left: auto;
  }
  .refresh-btn:hover { color: var(--fg); border-color: var(--rule-strong); }

  /* ── TABLE ─────────────────────────────────────────────────────── */
  .table-wrap {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }

  .table-scroll {
    overflow-x: auto;
    max-height: calc(100vh - 340px);
    min-height: 300px;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--panel);
    z-index: 2;
    text-align: left;
    padding: var(--sp-3) var(--sp-4);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-mute);
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }

  thead th.sortable { cursor: pointer; user-select: none; }
  thead th.sortable:hover { color: var(--fg-dim); }
  thead th.sortable::after {
    content: '↕';
    display: inline-block;
    margin-inline-start: 4px;
    color: var(--fg-mute);
    opacity: 0.4;
    font-size: 11px;
  }
  thead th.sortable.asc::after  { content: '↑'; opacity: 1; color: var(--accent); }
  thead th.sortable.desc::after { content: '↓'; opacity: 1; color: var(--accent); }

  tbody tr {
    border-top: 1px solid var(--rule);
    transition: background 100ms;
  }
  tbody tr:first-child { border-top: none; }
  tbody tr:hover { background: var(--panel-lift); }
  tbody tr.expanded { background: var(--panel-lift); }
  tbody tr { cursor: pointer; }

  tbody td {
    padding: var(--sp-3) var(--sp-4);
    vertical-align: middle;
    white-space: nowrap;
  }

  td.time     { color: var(--fg-dim); font-family: var(--font-mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  td.time .date { color: var(--fg-mute); }
  td.num, td.rr, td.risk, td.contracts {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  td.subject { max-width: 300px; overflow: hidden; text-overflow: ellipsis; color: var(--fg-dim); font-size: 12px; }

  /* Chips */
  .chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-family: var(--font-sans);
    line-height: 1.5;
  }

  .chip.bot-smt { background: color-mix(in oklab, var(--amber) 15%, transparent); color: var(--amber); border: 1px solid color-mix(in oklab, var(--amber) 30%, transparent); }
  .chip.bot-qt  { background: var(--info-dim); color: var(--info); border: 1px solid color-mix(in oklab, var(--info) 30%, transparent); }
  .chip.bot-test { background: var(--panel-lift); color: var(--fg-dim); border: 1px solid var(--rule); }

  .chip.dir-long  { background: var(--long-dim); color: var(--long); }
  .chip.dir-short { background: var(--short-dim); color: var(--short); }

  .chip.evt-signal        { background: var(--info-dim);  color: var(--info); }
  .chip.evt-dry_run_signal { background: color-mix(in oklab, var(--accent) 15%, transparent); color: var(--accent); }
  .chip.evt-target_hit    { background: var(--long-dim);  color: var(--long); }
  .chip.evt-stop_hit      { background: var(--short-dim); color: var(--short); }
  .chip.evt-slippage_close { background: var(--amber-dim); color: var(--amber); }
  .chip.evt-day_halt      { background: var(--short-dim); color: var(--short); }
  .chip.evt-startup       { background: var(--panel-lift); color: var(--fg-mute); border: 1px solid var(--rule); }

  /* Expanded row */
  tr.detail td {
    background: color-mix(in oklab, var(--panel-lift) 60%, var(--panel));
    padding: var(--sp-4) var(--sp-5);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-dim);
    white-space: pre-wrap;
    direction: rtl;
    text-align: right;
    line-height: 1.7;
    border-top: 1px dashed var(--rule);
  }
  tr.detail td .subject-line {
    display: block;
    color: var(--fg);
    font-weight: 600;
    margin-bottom: var(--sp-3);
    padding-bottom: var(--sp-2);
    border-bottom: 1px dashed var(--rule);
    direction: ltr;
    text-align: left;
    font-family: var(--font-sans);
    letter-spacing: 0.02em;
  }

  /* Empty + Loading + Error */
  .state {
    padding: var(--sp-8);
    text-align: center;
    color: var(--fg-dim);
  }
  .state h3 { margin: 0 0 var(--sp-2); color: var(--fg); font-weight: 500; font-size: 16px; }
  .state p { margin: 0; font-size: 13px; max-width: 40ch; margin-inline: auto; }
  .state code { font-family: var(--font-mono); background: var(--panel-lift); padding: 2px 6px; border-radius: 3px; font-size: 11px; }

  /* Footer */
  footer {
    margin-top: var(--sp-5);
    padding-top: var(--sp-4);
    border-top: 1px solid var(--rule);
    color: var(--fg-mute);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    gap: var(--sp-4);
    flex-wrap: wrap;
  }
  footer a { color: var(--fg-dim); text-decoration: none; }
  footer a:hover { color: var(--fg); }

  /* Scrollbar polish */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--panel); }
  ::-webkit-scrollbar-thumb { background: var(--rule-strong); border-radius: 5px; border: 2px solid var(--panel); }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in oklab, var(--rule-strong) 70%, var(--fg-dim)); }

  @media (max-width: 600px) {
    .app { padding: var(--sp-4) var(--sp-3) var(--sp-6); }
    h1 { font-size: 18px; }
    .kpi-value { font-size: 20px; }
    thead th, tbody td { padding: var(--sp-2) var(--sp-3); }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Trading Journal</h1>
    <div class="header-meta">
      <span class="live-badge">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="live-status">Loading…</span>
      </span>
      <span id="last-updated"></span>
      <button class="theme-toggle" id="theme-toggle" type="button">Theme</button>
    </div>
  </header>

  <section class="kpis" id="kpis" aria-label="Summary statistics">
    <!-- KPIs injected here -->
  </section>

  <section class="filters" aria-label="Filters">
    <div class="filter-group">
      <span class="filter-label">Bot</span>
      <div class="seg" role="tablist" data-filter="bot">
        <button type="button" data-value="all" class="active">All</button>
        <button type="button" data-value="SMT">SMT</button>
        <button type="button" data-value="QT">QT</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Event</span>
      <div class="seg" role="tablist" data-filter="event">
        <button type="button" data-value="all" class="active">All</button>
        <button type="button" data-value="signal">Signals</button>
        <button type="button" data-value="dry_run_signal">Dry-Run</button>
        <button type="button" data-value="target_hit">Wins</button>
        <button type="button" data-value="stop_hit">Losses</button>
      </div>
    </div>

    <div class="filter-group">
      <span class="filter-label">Range</span>
      <div class="seg" role="tablist" data-filter="range">
        <button type="button" data-value="today" class="active">Today</button>
        <button type="button" data-value="week">7d</button>
        <button type="button" data-value="month">30d</button>
        <button type="button" data-value="all">All</button>
      </div>
    </div>

    <input class="search-input" id="search" type="search" placeholder="Search subject…" />

    <button class="refresh-btn" id="refresh" type="button">Refresh</button>
  </section>

  <div class="table-wrap">
    <div class="table-scroll">
      <table id="signals-table">
        <thead>
          <tr>
            <th class="sortable desc" data-sort="timestamp">Time</th>
            <th>Bot</th>
            <th>Event</th>
            <th>Symbol</th>
            <th>Dir</th>
            <th class="sortable" data-sort="entry_price">Entry</th>
            <th class="sortable" data-sort="stop_price">Stop</th>
            <th class="sortable" data-sort="target_price">Target</th>
            <th class="sortable" data-sort="rr">R:R</th>
            <th class="sortable" data-sort="contracts">Qty</th>
            <th class="sortable" data-sort="risk_usd">Risk</th>
            <th>Subject</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="12"><div class="state" id="state"><h3>Loading signals…</h3><p>Fetching latest data from the repo.</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <footer>
    <span>Data: <a href="https://github.com/neoray261-eng/trading-journal-data" target="_blank" rel="noopener">trading-journal-data</a> · updated every 60 s</span>
    <span id="row-count">—</span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  const DATA_URL = 'https://raw.githubusercontent.com/neoray261-eng/trading-journal-data/main/signals.json';
  const REFRESH_MS = 60_000;

  const state = {
    signals: [],
    filter: { bot: 'all', event: 'all', range: 'today', q: '' },
    sort: { key: 'timestamp', dir: 'desc' },
    expanded: new Set(),
    loading: true,
    error: null,
    lastFetch: null,
  };

  // ── DATA ────────────────────────────────────────────────────────
  async function fetchSignals() {
    try {
      const r = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      state.signals = Array.isArray(data) ? data : [];
      state.error = null;
      state.lastFetch = new Date();
    } catch (e) {
      state.error = e.message || String(e);
    } finally {
      state.loading = false;
      render();
    }
  }

  // ── FILTER + SORT ───────────────────────────────────────────────
  function filtered() {
    const { bot, event, range, q } = state.filter;
    let cutoff = 0;
    if (range === 'today') {
      const d = new Date(); d.setHours(0,0,0,0);
      cutoff = d.getTime();
    } else if (range === 'week')  cutoff = Date.now() - 7  * 86400_000;
    else if (range === 'month')   cutoff = Date.now() - 30 * 86400_000;

    const ql = q.trim().toLowerCase();
    let rows = state.signals.filter(s => {
      if (bot !== 'all' && s.bot !== bot) return false;
      if (event !== 'all' && s.event !== event) return false;
      if (cutoff && new Date(s.timestamp).getTime() < cutoff) return false;
      if (ql && !(s.subject || '').toLowerCase().includes(ql)) return false;
      return true;
    });

    const { key, dir } = state.sort;
    const mul = dir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      let av = a[key], bv = b[key];
      if (key === 'timestamp') { av = new Date(av).getTime(); bv = new Date(bv).getTime(); }
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return av < bv ? -mul : av > bv ? mul : 0;
    });
    return rows;
  }

  // ── RENDER ──────────────────────────────────────────────────────
  const fmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 });
  const fmt0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function timeCell(iso) {
    if (!iso) return '<span class="date">—</span>';
    const d = new Date(iso);
    const today = new Date(); today.setHours(0,0,0,0);
    const isToday = d.getTime() >= today.getTime();
    const dateStr = isToday
      ? `<span class="date">today</span>`
      : `<span class="date">${d.toLocaleDateString('en-CA')}</span>`;
    const timeStr = d.toLocaleTimeString('en-GB', { hour12: false });
    return `${dateStr} ${timeStr}`;
  }

  function chip(kind, label) {
    return `<span class="chip ${kind}">${esc(label)}</span>`;
  }

  function eventLabel(e) {
    const m = {
      signal: 'Signal',
      dry_run_signal: 'Paper',
      target_hit: 'Target',
      stop_hit: 'Stop',
      slippage_close: 'Slipped',
      day_halt: 'Halt',
      startup: 'Startup',
    };
    return m[e] || e || '—';
  }

  function computeKPIs(signals) {
    const bySignal = signals.filter(s =>
      s.event === 'signal' || s.event === 'dry_run_signal');
    const wins = signals.filter(s => s.event === 'target_hit').length;
    const losses = signals.filter(s => s.event === 'stop_hit').length;
    const smt = signals.filter(s => s.bot === 'SMT').length;
    const qt  = signals.filter(s => s.bot === 'QT').length;
    const today = new Date(); today.setHours(0,0,0,0);
    const todayCount = signals.filter(s =>
      new Date(s.timestamp).getTime() >= today.getTime()).length;
    const rrs = bySignal.map(s => s.rr).filter(x => x != null);
    const avgRR = rrs.length ? rrs.reduce((a,b)=>a+b,0) / rrs.length : null;
    return { total: signals.length, smt, qt, wins, losses, todayCount, avgRR, signalCount: bySignal.length };
  }

  function renderKPIs(signals) {
    const k = computeKPIs(signals);
    const wl = k.wins + k.losses;
    const winRate = wl ? Math.round(100 * k.wins / wl) : null;

    const rows = [
      { label: 'Signals total', value: fmt0.format(k.total), hint: `${k.signalCount} entries` },
      { label: 'Today', value: fmt0.format(k.todayCount), hint: 'live count' },
      { label: 'SMT · QT', value: `${fmt0.format(k.smt)} · ${fmt0.format(k.qt)}`, hint: 'by bot' },
      { label: 'Wins · Losses', value: `${fmt0.format(k.wins)} · ${fmt0.format(k.losses)}`, hint: winRate != null ? `${winRate}% WR` : 'no outcomes yet' },
      { label: 'Avg R:R planned', value: k.avgRR != null ? `1 : ${fmt.format(k.avgRR)}` : '—', hint: `across ${k.signalCount} signals`, accent: true },
    ];
    document.getElementById('kpis').innerHTML = rows.map(r => `
      <div class="kpi${r.accent ? ' accent' : ''}">
        <div class="kpi-label">${esc(r.label)}</div>
        <div class="kpi-value">${r.value}</div>
        <div class="kpi-hint">${esc(r.hint)}</div>
      </div>
    `).join('');
  }

  function renderRows() {
    const rowsEl = document.getElementById('rows');
    const stateEl = () => document.getElementById('state');

    if (state.loading) {
      rowsEl.innerHTML = `<tr><td colspan="12"><div class="state"><h3>Loading signals…</h3><p>Fetching latest data.</p></div></td></tr>`;
      document.getElementById('row-count').textContent = '';
      return;
    }
    if (state.error) {
      rowsEl.innerHTML = `<tr><td colspan="12"><div class="state">
        <h3>Couldn't load signals</h3>
        <p>Error: <code>${esc(state.error)}</code></p></div></td></tr>`;
      document.getElementById('row-count').textContent = '';
      return;
    }

    const rows = filtered();
    document.getElementById('row-count').textContent = `${rows.length} of ${state.signals.length} shown`;

    if (rows.length === 0) {
      const empty = state.signals.length === 0
        ? '<h3>No signals yet</h3><p>The bots will populate this as they scan. Signals appear here within seconds of firing.</p>'
        : '<h3>No signals match</h3><p>Try widening the range or clearing the search.</p>';
      rowsEl.innerHTML = `<tr><td colspan="12"><div class="state">${empty}</div></td></tr>`;
      return;
    }

    let html = '';
    rows.forEach((s, i) => {
      const key = s.timestamp + '|' + i;
      const isExp = state.expanded.has(key);
      const dirClass = s.direction === 'LONG' ? 'dir-long' : s.direction === 'SHORT' ? 'dir-short' : '';
      const botClass = 'bot-' + (s.bot || '').toLowerCase();
      const evtClass = 'evt-' + (s.event || 'signal');

      html += `<tr data-key="${esc(key)}"${isExp ? ' class="expanded"' : ''}>
        <td class="time">${timeCell(s.timestamp)}</td>
        <td>${s.bot ? chip(botClass, s.bot) : ''}</td>
        <td>${chip(evtClass, eventLabel(s.event))}</td>
        <td class="num" style="text-align:left">${esc(s.symbol || '—')}</td>
        <td>${s.direction ? chip(dirClass, s.direction) : ''}</td>
        <td class="num">${s.entry_price != null ? fmt.format(s.entry_price) : '—'}</td>
        <td class="num">${s.stop_price != null ? fmt.format(s.stop_price) : '—'}</td>
        <td class="num">${s.target_price != null ? fmt.format(s.target_price) : '—'}</td>
        <td class="rr">${s.rr != null ? '1:' + fmt.format(s.rr) : '—'}</td>
        <td class="contracts">${s.contracts != null ? fmt0.format(s.contracts) : '—'}</td>
        <td class="risk">${s.risk_usd != null ? '$' + fmt0.format(s.risk_usd) : '—'}</td>
        <td class="subject" title="${esc(s.subject || '')}">${esc((s.subject || '').slice(0, 80))}</td>
      </tr>`;
      if (isExp) {
        html += `<tr class="detail"><td colspan="12">
          <span class="subject-line">${esc(s.subject || '')}</span>${esc(s.body || '(empty body)')}
        </td></tr>`;
      }
    });
    rowsEl.innerHTML = html;

    rowsEl.querySelectorAll('tr[data-key]').forEach(tr => {
      tr.addEventListener('click', () => {
        const k = tr.dataset.key;
        if (state.expanded.has(k)) state.expanded.delete(k);
        else state.expanded.add(k);
        renderRows();
      });
    });
  }

  function renderLiveStatus() {
    const el = document.getElementById('live-status');
    if (state.loading) { el.textContent = 'Loading…'; return; }
    if (state.error)  { el.textContent = 'Offline'; return; }
    el.textContent = 'Live';

    const ago = document.getElementById('last-updated');
    if (state.lastFetch) {
      ago.textContent = 'Updated ' + state.lastFetch.toLocaleTimeString('en-GB', { hour12: false });
    } else {
      ago.textContent = '';
    }
  }

  function render() {
    renderKPIs(state.signals);
    renderRows();
    renderLiveStatus();
  }

  // ── FILTERS ─────────────────────────────────────────────────────
  document.querySelectorAll('.seg').forEach(seg => {
    seg.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const filterKey = seg.dataset.filter;
      state.filter[filterKey] = b.dataset.value;
      seg.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
      state.expanded.clear();
      renderRows();
    });
  });

  document.getElementById('search').addEventListener('input', (e) => {
    state.filter.q = e.target.value;
    renderRows();
  });

  document.getElementById('refresh').addEventListener('click', () => {
    state.loading = true; render();
    fetchSignals();
  });

  // Sort headers
  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (state.sort.key === key) {
        state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sort.key = key;
        state.sort.dir = key === 'timestamp' ? 'desc' : 'asc';
      }
      document.querySelectorAll('th.sortable').forEach(t => t.classList.remove('asc', 'desc'));
      th.classList.add(state.sort.dir);
      renderRows();
    });
  });

  // Theme toggle (cycles: system → light → dark → system…)
  const themeBtn = document.getElementById('theme-toggle');
  function setThemeLabel() {
    const stored = localStorage.getItem('tj-theme') || 'system';
    themeBtn.textContent = stored === 'system' ? 'Auto' : stored[0].toUpperCase() + stored.slice(1);
  }
  function applyStoredTheme() {
    const t = localStorage.getItem('tj-theme') || 'system';
    if (t === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
  }
  themeBtn.addEventListener('click', () => {
    const t = localStorage.getItem('tj-theme') || 'system';
    const next = t === 'system' ? 'light' : t === 'light' ? 'dark' : 'system';
    localStorage.setItem('tj-theme', next);
    applyStoredTheme();
    setThemeLabel();
  });
  applyStoredTheme();
  setThemeLabel();

  // ── BOOT ────────────────────────────────────────────────────────
  fetchSignals();
  setInterval(fetchSignals, REFRESH_MS);
})();
</script>

</body>
</html>
