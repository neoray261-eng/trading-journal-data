name: Check Signal Outcomes

# For every open dry-run signal, fetch price bars from Yahoo Finance
# (free, no auth) and mark whether target or stop was hit first.
# This is what gives the paper-trading dashboard real W/L numbers.

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:

concurrency:
  group: journal-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve outcomes
        run: |
          python <<'PY'
          import json, os, re, datetime, urllib.request, urllib.error

          UA = {"User-Agent": "Mozilla/5.0 (trading-journal-bot)"}
          SYM_MAP = {"MNQ": "NQ=F", "NQ": "NQ=F", "MES": "ES=F", "ES": "ES=F"}

          with open("signals.json") as f:
              signals = json.load(f)

          def utc_now():
              return datetime.datetime.utcnow().replace(tzinfo=datetime.timezone.utc)

          def parse_ts(s):
              # "2026-08-16T10:55:37Z"
              return datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))

          # 1) Match each existing target_hit/stop_hit back to its source signal
          #    so we don't re-resolve. Match by (bot, symbol, direction) and the
          #    signal's timestamp <= outcome's timestamp within 24h.
          def find_source_idx(outcome_entry):
              t_out = parse_ts(outcome_entry["timestamp"])
              for i, s in enumerate(signals):
                  if s.get("event") not in ("signal", "dry_run_signal"): continue
                  if s.get("bot") != outcome_entry.get("bot"): continue
                  if s.get("symbol") != outcome_entry.get("symbol"): continue
                  if s.get("direction") != outcome_entry.get("direction"): continue
                  t_sig = parse_ts(s["timestamp"])
                  if 0 <= (t_out - t_sig).total_seconds() <= 86400 and not s.get("resolved"):
                      return i
              return None

          # First pass: back-fill resolved flags from any existing outcome events
          for e in signals:
              if e.get("event") in ("target_hit", "stop_hit"):
                  idx = find_source_idx(e)
                  if idx is not None:
                      signals[idx]["resolved"] = True
                      signals[idx]["outcome"] = "target" if e["event"] == "target_hit" else "stop"

          # 2) Find open signals to check
          # BUGFIX 2026-08-17: age/expiry check MUST run before the "missing
          # fields" filter — otherwise a malformed signal (missing entry/stop/
          # target due to parser bugs) stays resolved=false FOREVER, inflating
          # the "open" count and calendar/hourly denominators for weeks.
          now = utc_now()
          to_check = []
          for i, s in enumerate(signals):
              if s.get("event") not in ("signal", "dry_run_signal"): continue
              if s.get("resolved"): continue
              t_sig = parse_ts(s["timestamp"])
              age = (now - t_sig).total_seconds()
              # Age/expiry first — even malformed signals get retired after 2d
              if age > 86400 * 2:
                  s["resolved"] = True
                  s["outcome"] = "expired"
                  continue
              # Now the has-required-fields check (malformed signals stay
              # unresolved for max 2d, then get expired above)
              if not all(s.get(k) is not None for k in ("entry_price", "stop_price", "target_price", "direction", "symbol")): continue
              if age < 300: continue         # give at least 5 min to develop
              to_check.append(i)

          print(f"open signals to check: {len(to_check)}")

          def fetch_bars(yahoo_sym, start_ts, end_ts):
              # 1-minute bars, up to ~5 days back. Yahoo returns unix seconds.
              range_days = max(1, min(5, int((end_ts - start_ts) / 86400) + 1))
              url = (f"https://query1.finance.yahoo.com/v7/finance/chart/{yahoo_sym}"
                     f"?interval=1m&range={range_days}d")
              try:
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.load(r)
              except Exception as e:
                  print(f"fetch failed {yahoo_sym}: {e}")
                  return []
              try:
                  result = data["chart"]["result"][0]
                  ts = result["timestamp"]
                  q  = result["indicators"]["quote"][0]
                  bars = []
                  for i, t in enumerate(ts):
                      if t < start_ts - 60 or t > end_ts + 60: continue
                      h = q["high"][i]; l = q["low"][i]
                      if h is None or l is None: continue
                      bars.append((t, h, l))
                  return bars
              except Exception as e:
                  print(f"parse failed {yahoo_sym}: {e}")
                  return []

          # ── Deep analytics: MFE/MAE/duration per resolved trade ──
          # Stored separately in analytics/trades_deep.json — invisible to the
          # main dashboard but always available for post-trade analysis.
          deep_entries = []
          deep_path = "analytics/trades_deep.json"
          os.makedirs("analytics", exist_ok=True)
          try:
              with open(deep_path) as f:
                  deep_existing = json.load(f)
          except Exception:
              deep_existing = []

          new_events = []
          for i in to_check:
              s = signals[i]
              yh = SYM_MAP.get(s["symbol"])
              if not yh: continue
              t_sig_dt = parse_ts(s["timestamp"])
              start_ts = int(t_sig_dt.timestamp())
              end_ts   = int(now.timestamp())
              bars = fetch_bars(yh, start_ts, end_ts)
              if not bars:
                  print(f"no bars for {s['symbol']} since {s['timestamp']}")
                  continue

              entry  = s["entry_price"]
              stop   = s["stop_price"]
              target = s["target_price"]
              is_long = s["direction"] == "LONG"

              outcome = None; hit_ts = None; hit_price = None; bar_extreme = None
              # MFE (max favorable) / MAE (max adverse) — track extremes while walking bars
              mfe_extreme = None; mfe_ts = None
              mae_extreme = None; mae_ts = None
              for (t, h, l) in bars:
                  # Update MFE / MAE trackers BEFORE checking crossings — reflects
                  # what the price did during the trade, up to and including the hit bar
                  if is_long:
                      if mfe_extreme is None or h > mfe_extreme: mfe_extreme, mfe_ts = h, t
                      if mae_extreme is None or l < mae_extreme: mae_extreme, mae_ts = l, t
                      hit_target = h >= target
                      hit_stop   = l <= stop
                  else:  # SHORT
                      if mfe_extreme is None or l < mfe_extreme: mfe_extreme, mfe_ts = l, t
                      if mae_extreme is None or h > mae_extreme: mae_extreme, mae_ts = h, t
                      hit_target = l <= target
                      hit_stop   = h >= stop
                  if hit_target and hit_stop:
                      # both in same 1-min bar — conservative: stop first
                      outcome = "stop"; hit_ts = t; hit_price = stop
                      bar_extreme = l if is_long else h
                      break
                  if hit_stop:
                      outcome = "stop"; hit_ts = t; hit_price = stop
                      bar_extreme = l if is_long else h
                      break
                  if hit_target:
                      outcome = "target"; hit_ts = t; hit_price = target
                      bar_extreme = h if is_long else l
                      break

              if outcome:
                  # Slippage = how far past the trigger the bar actually went.
                  # For stop: worse fill than planned (positive = pain).
                  # For target: bar overshot target (positive = target was reached easily).
                  slip_pts = abs(bar_extreme - hit_price) if bar_extreme is not None else 0.0
                  s["resolved"] = True
                  s["outcome"] = outcome
                  s["outcome_time"] = datetime.datetime.fromtimestamp(hit_ts, tz=datetime.timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z")
                  s["outcome_price"] = hit_price
                  s["bar_extreme"] = bar_extreme
                  s["slippage_pts"] = round(slip_pts, 2)
                  new_events.append({
                      "timestamp": s["outcome_time"],
                      "bot": s["bot"],
                      "event": "target_hit" if outcome == "target" else "stop_hit",
                      "symbol": s["symbol"],
                      "direction": s["direction"],
                      "entry_price": entry,
                      "stop_price": stop,
                      "target_price": target,
                      "contracts": s.get("contracts"),
                      "rr": s.get("rr"),
                      "risk_usd": s.get("risk_usd"),
                      "bar_extreme": bar_extreme,
                      "slippage_pts": round(slip_pts, 2),
                      "subject": f"[AUTO] {s['bot']} {s['symbol']} {s['direction']} {'TARGET HIT' if outcome=='target' else 'STOP HIT'} @ {hit_price}",
                      "body": (f"resolved paper trade\nentry: {entry}\nstop: {stop}\ntarget: {target}\n"
                               f"hit: {hit_price} at {s['outcome_time']}\n"
                               f"bar_extreme: {bar_extreme}\nslippage_pts: {round(slip_pts,2)}\n"
                               f"source signal: {s['timestamp']}"),
                  })

                  # ── DEEP ANALYTICS (hidden from dashboard) ──
                  # MFE/MAE + duration, saved separately to analytics/trades_deep.json.
                  # These metrics are for post-trade review, not daily glance.
                  risk_pts = abs(entry - stop)
                  duration_min = (hit_ts - start_ts) / 60.0
                  mfe_pts = mae_pts = mfe_r = mae_r = None
                  mfe_t = mae_t = None
                  if mfe_extreme is not None and risk_pts > 0:
                      if is_long:
                          mfe_pts = mfe_extreme - entry     # favorable = up from entry
                          mae_pts = entry - mae_extreme     # adverse = down from entry
                      else:
                          mfe_pts = entry - mfe_extreme     # favorable = down from entry
                          mae_pts = mae_extreme - entry     # adverse = up from entry
                      mfe_r = mfe_pts / risk_pts
                      mae_r = mae_pts / risk_pts
                      mfe_t = round((mfe_ts - start_ts) / 60.0, 1)
                      mae_t = round((mae_ts - start_ts) / 60.0, 1)

                  deep_entries.append({
                      "signal_ts":       s["timestamp"],
                      "outcome_ts":      s["outcome_time"],
                      "bot":             s.get("bot"),
                      "symbol":          s.get("symbol"),
                      "direction":       s.get("direction"),
                      "killzone":        s.get("killzone"),
                      "entry_price":     entry,
                      "stop_price":      stop,
                      "target_price":    target,
                      "outcome":         outcome,
                      "outcome_price":   hit_price,
                      "bar_extreme":     bar_extreme,
                      "slippage_pts":    round(slip_pts, 2),
                      "mfe_pts":         round(mfe_pts, 2) if mfe_pts is not None else None,
                      "mae_pts":         round(mae_pts, 2) if mae_pts is not None else None,
                      "mfe_r":           round(mfe_r,   3) if mfe_r   is not None else None,
                      "mae_r":           round(mae_r,   3) if mae_r   is not None else None,
                      "mfe_time_min":    mfe_t,
                      "mae_time_min":    mae_t,
                      "duration_min":    round(duration_min, 1),
                      "rr_planned":      s.get("rr"),
                      "contracts":       s.get("contracts"),
                      "risk_usd":        s.get("risk_usd"),
                  })

                  print(f"resolved {s['bot']} {s['symbol']} {s['direction']} @ {s['timestamp']} → {outcome} @ {hit_price} slip={slip_pts:.2f}pt MFE={mfe_r:.2f}R MAE={mae_r:.2f}R dur={duration_min:.0f}min" if mfe_r is not None else f"resolved (no MFE/MAE)")

          signals.extend(new_events)
          # Sort by timestamp so new events land in place
          signals.sort(key=lambda x: x.get("timestamp", ""))

          # Cap size
          if len(signals) > 5000:
              signals = signals[-5000:]

          with open("signals.json", "w") as f:
              json.dump(signals, f, indent=2, ensure_ascii=False)

          # Append new deep-analytics entries (dedup by signal_ts + bot + symbol)
          if deep_entries:
              seen = {(e.get("signal_ts"), e.get("bot"), e.get("symbol")) for e in deep_existing}
              additions = [e for e in deep_entries if (e["signal_ts"], e["bot"], e["symbol"]) not in seen]
              if additions:
                  deep_all = deep_existing + additions
                  deep_all.sort(key=lambda x: x.get("signal_ts") or "")
                  with open(deep_path, "w") as f:
                      json.dump(deep_all, f, indent=2, ensure_ascii=False)
                  print(f"deep analytics: +{len(additions)} entries (total: {len(deep_all)})")

          print(f"total signals: {len(signals)}  new outcome events: {len(new_events)}")
          PY

      - name: Commit & push (with retry — race with append_signal)
        run: |
          git config user.name  "outcome-bot"
          git config user.email "outcome-bot@users.noreply.github.com"
          git add signals.json analytics/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          # BUGFIX 2026-08-17: previous `git push || true` silently swallowed
          # rejected pushes when append_signal.yml raced us — outcome markers
          # would be lost and re-emitted next cron run, producing DUPLICATE
          # target_hit/stop_hit events. Retry up to 4× with pull --rebase so
          # our resolution commits actually land.
          git commit -m "auto-resolve: outcomes checked $(date -u +%FT%TZ)"
          for i in 1 2 3 4; do
            if git push; then
              echo "push OK on attempt $i"
              exit 0
            fi
            echo "push attempt $i failed — rebasing on latest and retrying"
            git pull --rebase --autostash origin main || {
              echo "rebase conflict — abandoning this cron cycle; next 15-min run will retry"
              git rebase --abort || true
              exit 0
            }
          done
          echo "push failed after 4 attempts — will retry next cron"
          exit 0
