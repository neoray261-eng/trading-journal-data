name: Append Trading Signal

# Called by the SMT/QT bots (via workflow_dispatch) to log each signal to
# signals.json. Auto-parses body fields into structured JSON for the dashboard.
#
# NOTE: We deliberately do NOT use `concurrency:` — GitHub Actions concurrency
# cancels any run beyond the 1-slot queue, which would silently drop signals
# when bots fire in bursts. Instead, every run works on the latest state, and
# on push conflict we reset + re-append and retry. Every dispatch is preserved.
on:
  workflow_dispatch:
    inputs:
      bot:
        description: "Bot source (SMT or QT)"
        required: true
        type: string
      subject:
        description: "Email subject"
        required: true
        type: string
      body:
        description: "Email body"
        required: true
        type: string

jobs:
  append:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append & push (self-healing on conflict)
        env:
          BOT:     ${{ github.event.inputs.bot }}
          SUBJECT: ${{ github.event.inputs.subject }}
          BODY:    ${{ github.event.inputs.body }}
        run: |
          git config user.name  "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "=== attempt $attempt ==="

            # Sync to the very latest remote state — throws away anything
            # local from a previous failed attempt this run.
            git fetch origin main
            git reset --hard origin/main

            # Rebuild signals.json fresh on this attempt's baseline.
            python <<'PY'
          import os, json, re, datetime
          bot = os.environ["BOT"]
          subject = os.environ["SUBJECT"]
          body = os.environ["BODY"]

          with open("signals.json") as f:
              signals = json.load(f)

          # Parse subject → symbol / direction / entry
          # BUGFIX 2026-08-17: the parser now searches BOTH subject and body for
          # every field. Previously entry_price came ONLY from `@N` in subject,
          # and stop/target/contracts/rr/risk came ONLY from body — but the SMT
          # bot puts fields as `entry=X stop=X ...` inside the msg (body), and
          # its subject is just "[DRY-RUN] LONG MNQ signal" with no numbers.
          # Result: EVERY SMT signal appeared in the journal with NULL prices.
          all_text = subject + "\n" + body
          symbol = None; direction = None; entry_price = None
          for sym in ("MNQ", "MES", "NQ", "ES"):
              if sym in subject.upper():
                  symbol = sym; break
          if   "LONG"  in subject.upper(): direction = "LONG"
          elif "SHORT" in subject.upper(): direction = "SHORT"

          def _num(pat, text, default=None, flags=0):
              m = re.search(pat, text, flags)
              if not m: return default
              try: return float(m.group(1).replace(",", ""))
              except: return default

          # Entry: try "entry=X" or "כניסה: X" in body/subject first,
          # then fall back to "@ N" in subject — but require a proper decimal
          # or 3+ digits so "IFVG@2m" doesn't get parsed as entry_price=2.0.
          entry_price = (_num(r"[Ee]ntry\s*[=:]\s*([\d,]+\.?\d*)", all_text)
                         or _num(r"כניסה\s*[=:]\s*([\d,]+\.?\d*)", all_text)
                         or _num(r"@\s*([\d,]+\.\d+|\d{3,}(?![A-Za-z]))", subject))

          # Stop / Target / Contracts / R:R / Risk — accept =, :, or whitespace as separator
          stop_price   = (_num(r"סטופ\s*[=:]?\s*([\d,.]+)", all_text)
                          or _num(r"[Ss]top\s*[=:]\s*([\d,.]+)", all_text)
                          or _num(r"[Ss]top\s+([\d,.]+)", all_text))
          target_price = (_num(r"יעד\s*[=:]?\s*([\d,.]+)", all_text)
                          or _num(r"[Tt]arget\s*[=:]\s*([\d,.]+)", all_text)
                          or _num(r"[Tt]arget\s+([\d,.]+)", all_text))
          contracts    = (_num(r"[Cc]ontracts\s*[=:]?\s*(\d+)", all_text)
                          or _num(r"חוזים\s*[=:]?\s*(\d+)", all_text))
          rr           = _num(r"R:R\s*[=:]?\s*1\s*[:=]\s*([\d]+\.?\d*)", all_text)
          risk_usd     = (_num(r"[Rr]isk[^$\n]*\$\s*([\d,.]+)", all_text)
                          or _num(r"סיכון[^$\n]*\$\s*([\d,.]+)", all_text)
                          or _num(r"[Rr]isk\s*[=:]\s*([\d,.]+)", all_text))
          # Killzone tag — appears as "Killzone=ASIA-KZ" or similar; None if absent
          kz_match = re.search(r"[Kk]illzone\s*[=:]\s*([A-Za-z0-9-]+)", all_text)
          killzone = kz_match.group(1) if kz_match else None

          # Event type — accept English OR Hebrew phrasing independently
          event = "signal"
          subj_low = subject.lower()
          if   any(w in subj_low for w in ["startup", "ping", "bot started"]): event = "startup"
          elif "target hit" in subj_low or ("יעד" in subject and "הושג" in subject): event = "target_hit"
          elif "stop hit"   in subj_low or "סטופ נפגע" in subject:                  event = "stop_hit"
          elif "slippage"   in subj_low or "סליפאג" in subject:                    event = "slippage_close"
          elif "halted"     in subj_low or "עצר" in subject:                       event = "day_halt"
          elif "[dry"       in subj_low or "dry-run" in subj_low:                   event = "dry_run_signal"

          entry = {
              "timestamp":    datetime.datetime.utcnow().isoformat(timespec="seconds") + "Z",
              "bot":          bot,
              "event":        event,
              "symbol":       symbol,
              "direction":    direction,
              "entry_price":  entry_price,
              "stop_price":   stop_price,
              "target_price": target_price,
              "contracts":    int(contracts) if contracts else None,
              "rr":           rr,
              "risk_usd":     risk_usd,
              "killzone":     killzone,
              "subject":      subject,
              "body":         body,
          }
          signals.append(entry)
          if len(signals) > 5000:
              signals = signals[-5000:]
          with open("signals.json", "w") as f:
              json.dump(signals, f, indent=2, ensure_ascii=False)
          print(f"appended: bot={bot} event={event} symbol={symbol} direction={direction} total={len(signals)}")
          PY

            git add signals.json
            if git diff --cached --quiet; then
              echo "nothing to commit — file unchanged"
              exit 0
            fi
            git commit -m "append: $BOT ${SUBJECT:0:80}"

            if git push; then
              echo "SUCCESS on attempt $attempt"
              exit 0
            fi
            echo "push failed on attempt $attempt — someone raced us; will re-append on fresh state"
            sleep $((attempt * 2))
          done
          echo "FAILED after 5 attempts"
          exit 1
